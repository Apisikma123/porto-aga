<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140810"/>
      <stop offset="100%" stop-color="#040509"/>
    </radialGradient>

    <!-- Crimson Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF385C" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#DC143C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#800018" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Outer Facet Gradient -->
    <linearGradient id="outerFacetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="outerFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242838" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d0e14" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="outerFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#08090e" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Neon Crimson Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#DC143C"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container Backdrop -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#DC143C" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Outer Cube Faces -->
  <polygon points="32,7 54,19.5 32,32 10,19.5" fill="url(#outerFacetTop)"/>
  <polygon points="10,19.5 32,32 32,57 10,44.5" fill="url(#outerFacetLeft)"/>
  <polygon points="54,19.5 32,32 32,57 54,44.5" fill="url(#outerFacetRight)"/>

  <!-- Hyper-dimensional Connecting Rays (Outer to Inner Core) -->
  <g stroke="url(#laserGrad)" stroke-width="1.3" opacity="0.85">
    <line x1="32" y1="7" x2="32" y2="20"/>
    <line x1="54" y1="19.5" x2="43" y2="25.8"/>
    <line x1="54" y1="44.5" x2="43" y2="38.2"/>
    <line x1="32" y1="57" x2="32" y2="44"/>
    <line x1="10" y1="44.5" x2="21" y2="38.2"/>
    <line x1="10" y1="19.5" x2="21" y2="25.8"/>
  </g>

  <!-- Outer Isometric Cube Edges -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="32,7 54,19.5 54,44.5 32,57 10,44.5 10,19.5"/>
    <line x1="32" y1="32" x2="32" y2="57"/>
    <line x1="32" y1="32" x2="54" y2="19.5"/>
    <line x1="32" y1="32" x2="10" y2="19.5"/>
  </g>

  <!-- Inner Crimson Tesseract Core -->
  <g filter="url(#neonGlow)">
    <polygon points="32,20 43,25.8 32,32 21,25.8" fill="url(#coreGlow)"/>
    <polygon points="21,25.8 32,32 32,44 21,38.2" fill="#8b0018" fill-opacity="0.75"/>
    <polygon points="43,25.8 32,32 32,44 43,38.2" fill="#5c0010" fill-opacity="0.85"/>

    <!-- Inner Core Edges -->
    <polygon points="32,20 43,25.8 43,38.2 32,44 21,38.2 21,25.8" fill="none" stroke="#FF3358" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="32" y1="32" x2="32" y2="44" stroke="#FF4D6D" stroke-width="1.8"/>
    <line x1="32" y1="32" x2="43" y2="25.8" stroke="#FF4D6D" stroke-width="1.8"/>
    <line x1="32" y1="32" x2="21" y2="25.8" stroke="#FF4D6D" stroke-width="1.8"/>

    <!-- Central Singularity Spark -->
    <circle cx="32" cy="32" r="2.2" fill="#ffffff"/>
  </g>
</svg>
