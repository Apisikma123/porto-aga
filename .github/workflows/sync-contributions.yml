name: Sync GitHub Contributions

on:
  schedule:
    # Every day at 00:15 UTC (07:15 WIB)
    - cron: '15 0 * * *'
  workflow_dispatch: # Manual trigger
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub Contributions
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_USER: Apisikma123
        run: |
          # GraphQL query for contribution data
          QUERY='{
            "query": "query { user(login: \"'$GH_USER'\") { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { contributionCount date color } } } } } }"
          }'

          RESPONSE=$(curl -s -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST https://api.github.com/graphql \
            -d "$QUERY")

          # Parse with Node.js (available on ubuntu-latest)
          node -e "
            const data = JSON.parse(process.argv[1]);
            const cal = data?.data?.user?.contributionsCollection?.contributionCalendar;
            if (!cal) { console.error('No data:', JSON.stringify(data)); process.exit(1); }

            const total = cal.totalContributions.toLocaleString();
            const contributions = [];

            for (const week of cal.weeks) {
              for (const day of week.contributionDays) {
                const count = day.contributionCount;
                let level = 0;
                if (count > 0) level = 1;
                if (count > 3) level = 2;
                if (count > 8) level = 3;
                if (count > 15) level = 4;

                contributions.push({
                  date: day.date,
                  count,
                  level,
                  tooltip: day.date + ': ' + count + ' contributions'
                });
              }
            }

            const output = { total, contributions, updatedAt: new Date().toISOString() };
            require('fs').writeFileSync('public/contributions.json', JSON.stringify(output, null, 2));
            console.log('Synced: ' + total + ' contributions, ' + contributions.length + ' days');
          " "$RESPONSE"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet public/contributions.json && echo "No changes" && exit 0
          git add public/contributions.json
          git commit -m "chore: sync GitHub contributions [skip ci]"
          git push
