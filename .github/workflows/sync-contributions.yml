name: Sync GitHub Contributions

on:
  schedule:
    # Every day at 00:15 UTC (07:15 WIB)
    - cron: '15 0 * * *'
  workflow_dispatch: # Manual trigger
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub Contributions
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_USER: Apisikma123
        run: |
          node -e "
            async function main() {
              const username = process.env.GH_USER || 'Apisikma123';
              const token = process.env.GH_TOKEN;
              let output = null;

              // 1. Try GitHub GraphQL API if token is provided
              if (token) {
                try {
                  const query = JSON.stringify({
                    query: 'query { user(login: \"' + username + '\") { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { contributionCount date contributionLevel } } } } } }'
                  });
                  const res = await fetch('https://api.github.com/graphql', {
                    method: 'POST',
                    headers: {
                      'Authorization': 'bearer ' + token,
                      'Content-Type': 'application/json',
                      'User-Agent': 'Node-Fetch'
                    },
                    body: query
                  });
                  const data = await res.json();
                  const cal = data?.data?.user?.contributionsCollection?.contributionCalendar;
                  if (cal && cal.weeks) {
                    const levelMap = { 'NONE': 0, 'FIRST_QUARTILE': 1, 'SECOND_QUARTILE': 2, 'THIRD_QUARTILE': 3, 'FOURTH_QUARTILE': 4 };
                    const contributions = [];
                    for (const week of cal.weeks) {
                      for (const day of week.contributionDays) {
                        contributions.push({
                          date: day.date,
                          count: day.contributionCount,
                          level: levelMap[day.contributionLevel] !== undefined ? levelMap[day.contributionLevel] : (day.contributionCount > 0 ? 1 : 0),
                          tooltip: day.date + ': ' + day.contributionCount + ' contributions'
                        });
                      }
                    }
                    output = {
                      total: cal.totalContributions.toLocaleString(),
                      contributions,
                      updatedAt: new Date().toISOString()
                    };
                    console.log('Successfully fetched via GitHub GraphQL API:', output.total);
                  }
                } catch (e) {
                  console.warn('GraphQL API failed, using fallback:', e.message);
                }
              }

              // 2. Fallback to public GitHub contribution API (No token required)
              if (!output) {
                try {
                  const res = await fetch('https://github-contributions-api.jogruber.de/v4/' + username + '?y=last');
                  const data = await res.json();
                  if (data && data.contributions) {
                    const totalNum = (data.total && data.total.lastYear) || data.contributions.reduce((a, b) => a + (b.count || 0), 0);
                    output = {
                      total: totalNum.toLocaleString(),
                      contributions: data.contributions.map(d => ({
                        date: d.date,
                        count: d.count,
                        level: d.level,
                        tooltip: d.date + ': ' + d.count + ' contributions'
                      })),
                      updatedAt: new Date().toISOString()
                    };
                    console.log('Successfully fetched via Public API:', output.total);
                  }
                } catch (e) {
                  console.error('Fallback API failed:', e.message);
                }
              }

              if (!output) {
                console.error('All contribution fetch attempts failed.');
                process.exit(1);
              }

              require('fs').writeFileSync('public/contributions.json', JSON.stringify(output, null, 2));
              console.log('Saved public/contributions.json successfully! Total: ' + output.total + ' (' + output.contributions.length + ' days)');
            }
            main();
          "

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet public/contributions.json && echo "No changes" && exit 0
          git add public/contributions.json
          git commit -m "chore: sync GitHub contributions [skip ci]"
          git push
